services:
  web_django:
    build: .
    container_name: graduation_pr
    command: bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    restart: on-failure
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
    - ./.env

  db:
    image: postgres:17
    restart: on-failure
    volumes:
      - postgres_data:/var/lib/postgres/data
    env_file:
      - ./.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER" ]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
